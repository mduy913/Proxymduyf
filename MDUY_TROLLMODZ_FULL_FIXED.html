<script id="mduy-auto-script">
(()=>{
  'use strict';
  const overlay=document.getElementById('mduy-auto-overlay');
  const form=document.getElementById('mduy-auto-form');
  const keyBox=document.getElementById('mduy-auto-key');
  const go=document.getElementById('mduy-auto-go');
  const status=document.getElementById('mduy-auto-status');
  if(!overlay||!form||!keyBox||!go||!status)return;

  const OFFICIAL_ORIGIN='https://client.trollmodz.store';
  const isOfficialOrigin=location.origin===OFFICIAL_ORIGIN;
  const originalForm=()=>Array.from(document.querySelectorAll('form')).find(f=>
    !overlay.contains(f)&&f.querySelector('.ph-keyinput input'))||null;
  const originalInput=()=>{const f=originalForm();return f?.querySelector('.ph-keyinput input')||null};
  const originalSubmit=()=>{const f=originalForm();return f?.querySelector('button[type="submit"],button.ph-btn--primary')||null};
  let submittedAt=0;

  function setStatus(message,kind='info'){
    status.textContent=message;
    status.style.color=kind==='error'?'#ff7777':kind==='success'?'#7df0b2':'#aaa';
  }
  function setNativeValue(el,value){
    const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;
    if(setter)setter.call(el,value);else el.value=value;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function updateOverlay(){
    const f=originalForm();
    // Keep the gate visible only while the original login form is present.
    overlay.hidden=!f;
    document.documentElement.style.overflow=f?'hidden':'';
  }
  function inspectResult(){
    const text=(document.body?.innerText||'').toLowerCase();
    const f=originalForm();
    if(submittedAt && !f){
      overlay.hidden=true;
      document.documentElement.style.overflow='';
      return;
    }
    if(!submittedAt || Date.now()-submittedAt<500)return;
    const errors=['invalid key','key is invalid','key expired','expired key','unauthorized','invalid license','key already in use'];
    const found=errors.find(x=>text.includes(x));
    if(found){setStatus('Trollmodz báo key không hợp lệ hoặc không dùng được. Kiểm tra thông báo trên trang.','error');go.disabled=false;}
  }

  form.addEventListener('submit',event=>{
    event.preventDefault();
    const value=keyBox.value.trim();
    if(!value){setStatus('Nhập key trước đã.','error');keyBox.focus();return;}
    if(!isOfficialOrigin){
      setStatus('File này không chạy trên domain chính thức nên không thể xác thực thật. Mở Trollmodz chính thức để đăng nhập.','error');
      return;
    }
    const f=originalForm(), input=originalInput(), submit=originalSubmit();
    if(!f||!input||!submit){setStatus('Chưa tìm thấy form đăng nhập gốc. Tải lại trang rồi thử lại.','error');return;}
    submittedAt=Date.now();
    go.disabled=true;
    setStatus('Đang gửi key tới form Trollmodz chính thức…');
    setNativeValue(input,value);
    // requestSubmit runs the original form's normal submit handlers; no fake success state.
    setTimeout(()=>{
      try{
        if(typeof f.requestSubmit==='function') f.requestSubmit(submit);
        else submit.click();
        setStatus('Đã gửi yêu cầu. Đang chờ phản hồi từ Trollmodz…');
      }catch(err){
        go.disabled=false;
        setStatus('Không gửi được form gốc. Hãy thử đăng nhập trực tiếp trên Trollmodz.','error');
      }
      setTimeout(()=>{if(!overlay.hidden)go.disabled=false;inspectResult();},1800);
    },80);
  });

  const observer=new MutationObserver(()=>{updateOverlay();inspectResult();});
  observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,characterData:true,attributeFilter:['class','style','hidden','aria-invalid']});
  window.addEventListener('pageshow',()=>{submittedAt=0;go.disabled=false;updateOverlay();});
  window.addEventListener('popstate',()=>{submittedAt=0;go.disabled=false;updateOverlay();});
  updateOverlay();
})();
</script>
