<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đang tải...</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}
.download-btn {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 100%);
    border: none;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: all 0.3s;
    animation: pulse 2s ease-in-out infinite;
}
.download-btn:active {
    transform: scale(0.98);
}
.download-btn .icon {
    font-size: 80px;
    animation: bounce 1.5s ease-in-out infinite;
}
.download-btn .text {
    background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.download-btn .sub {
    font-size: 14px;
    color: #888;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-top: 10px;
    padding: 0 20px;
    text-align: center;
}
.download-btn.error {
    background: linear-gradient(135deg, #1a0000, #2a0000);
    animation: none;
}
.download-btn.error .text {
    background: none;
    -webkit-text-fill-color: #ef4444;
    color: #ef4444;
}
.download-btn.success {
    animation: successGlow 2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(168, 85, 247, 0); }
    50% { box-shadow: inset 0 0 100px 0 rgba(168, 85, 247, 0.3); }
}
@keyframes successGlow {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(34, 197, 94, 0); }
    50% { box-shadow: inset 0 0 100px 0 rgba(34, 197, 94, 0.3); }
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
</style>
</head>
<body>

<button class="download-btn" id="btn">
    <div class="icon" id="icon">📥</div>
    <div class="text" id="text">ĐANG TẢI...</div>
    <div class="sub" id="sub">Vui lòng đợi</div>
</button>

<script>
(function() {
    'use strict';

    var btn = document.getElementById('btn');
    var iconEl = document.getElementById('icon');
    var textEl = document.getElementById('text');
    var subEl = document.getElementById('sub');

    var FIREBASE_URL = 'https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/configs/';

    function getParam(name) {
        var params = new URLSearchParams(location.search);
        return params.get(name);
    }

    function setState(state, text, sub) {
        if (state === 'success') {
            btn.classList.add('success');
            btn.classList.remove('error');
            iconEl.textContent = '✅';
        } else if (state === 'error') {
            btn.classList.add('error');
            btn.classList.remove('success');
            iconEl.textContent = '❌';
        } else {
            btn.classList.remove('error', 'success');
            iconEl.textContent = '📥';
        }
        textEl.textContent = text;
        if (sub !== undefined) subEl.textContent = sub;
    }

    function downloadBlob(content, filename) {
        var base64 = btoa(unescape(encodeURIComponent(content)));
        var dataUri = 'data:application/x-apple-aspen-config;base64,' + base64;
        
        var isSafari = /iPhone|iPad|iPod/i.test(navigator.userAgent) && /Safari/i.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/i.test(navigator.userAgent);
        
        if (isSafari) {
            window.location.href = dataUri;
        } else {
            var a = document.createElement('a');
            a.href = dataUri;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function() { document.body.removeChild(a); }, 100);
        }
    }

    async function loadAndDownload() {
        var configId = getParam('id');

        if (!configId) {
            setState('error', 'LỖI', 'Không có ID config trong link');
            return;
        }

        setState('loading', 'ĐANG TẢI...', 'Đang lấy dữ liệu từ server');

        try {
            var response = await fetch(FIREBASE_URL + configId + '.json');
            
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            var data = await response.json();

            if (!data || !data.content) {
                setState('error', 'KHÔNG TÌM THẤY', 'Link đã hết hạn hoặc không tồn tại');
                return;
            }

            var sizeKB = Math.round(data.content.length / 1024);
            var count = data.count || '?';
            
            setState('success', 'ĐANG TẢI XUỐNG', count + ' WebClip • ' + sizeKB + 'KB');
            
            setTimeout(function() {
                downloadBlob(data.content, data.name || 'webclip-config.mobileconfig');
            }, 300);

            btn.onclick = function() {
                downloadBlob(data.content, data.name || 'webclip-config.mobileconfig');
            };

        } catch (err) {
            console.error(err);
            setState('error', 'LỖI', err.message);
        }
    }

    loadAndDownload();

})();
</script>

</body>
</html>
