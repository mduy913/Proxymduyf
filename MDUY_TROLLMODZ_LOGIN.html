<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDUY × Trollmodz</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#123348,#050a12 65%);color:#eefaff;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #38e0f877;border-radius:22px;background:#0b1422f5;box-shadow:0 0 45px #38e0f822}.logo{margin:auto auto 16px;width:58px;height:58px;display:grid;place-items:center;border:1px solid #38e0f8;border-radius:16px;color:#38e0f8;font-weight:900;font-size:20px}h1{text-align:center;letter-spacing:4px;margin:0}.sub{text-align:center;color:#8da4b8;font-size:12px;letter-spacing:2px;margin:8px 0 26px}label{display:block;margin-bottom:8px;font-size:12px;color:#b5c8d7}input{width:100%;padding:15px;border-radius:11px;border:1px solid #28465a;background:#050b13;color:white;font-size:15px;outline:none}input:focus{border-color:#38e0f8}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:11px;background:linear-gradient(90deg,#22b8d4,#38e0f8);font-weight:900;letter-spacing:1.5px;color:#031018}.note,.status{font-size:12px;line-height:1.6;color:#9cb2c2;margin-top:17px}.status{display:none;padding:10px;background:#142330;border-radius:9px}.foot{text-align:center;color:#627b8e;font-size:10px;letter-spacing:1px;margin-top:18px}
</style></head><body><main class="card"><div class="logo">MD</div><h1>MDUY</h1><div class="sub">TROLLMODZ · ACCESS PORTAL</div>
<form id="loginForm"><label for="key">LICENSE KEY</label><input id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập key Trollmodz..." required><button type="submit">UNLOCK</button></form>
<div class="status" id="status"></div><p class="note">Lưu ý: HTML mở riêng không thể tự điều khiển một tab/website khác. Để nút này điền key và bấm UNLOCK thật, đoạn script phải được tích hợp/chạy bên trong chính trang Trollmodz.</p><div class="foot">MDUY × TROLLMODZ</div></main>
<script>
(()=>{const form=document.getElementById('loginForm'),keyBox=document.getElementById('key'),status=document.getElementById('status');function show(t){status.textContent=t;status.style.display='block'}
function findKey(){return document.querySelector('.ph-keyinput input,input.ph-keyinput,input[placeholder*="key" i],input[placeholder*="license" i],input[name*="key" i]')}
function findButton(input){const root=input?.closest('form')||input?.parentElement?.parentElement||document;const list=[...root.querySelectorAll('button,input[type="submit"],[role="button"]')];return list.find(e=>/unlock|connect|login|sign in/i.test((e.innerText||e.value||e.getAttribute('aria-label')||'').trim()))||document.querySelector('.ph-connect button,button.ph-connect,.ph-btn')}
form.addEventListener('submit',e=>{e.preventDefault();const v=keyBox.value.trim();if(!v)return show('Nhập key trước.');const real=findKey();if(!real||real===keyBox)return show('Không tìm thấy form đăng nhập gốc. Hãy tích hợp HTML/script này vào chính trang Trollmodz; mở file riêng không thể bấm trang khác.');const setter=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(real),'value')?.set;if(setter)setter.call(real,v);else real.value=v;real.dispatchEvent(new Event('input',{bubbles:true}));real.dispatchEvent(new Event('change',{bubbles:true}));const btn=findButton(real);if(!btn)return show('Đã điền key nhưng chưa tìm thấy nút UNLOCK gốc.');btn.click();show('Đã bấm nút đăng nhập gốc. Trollmodz sẽ tự hiển thị kết quả xác thực.')});
const observer=new MutationObserver(()=>{const real=findKey(),card=document.querySelector('.card');if(!real||!card)return;const visible=!!(real.offsetWidth||real.offsetHeight||real.getClientRects().length);card.style.display=visible?'':'none'});observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true});
})();
</script></body></html>
