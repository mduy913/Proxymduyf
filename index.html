<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đang tải...</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
.btn {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 100%);
    border: none; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 32px; font-weight: 900; letter-spacing: 2px;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    animation: pulse 2s ease-in-out infinite;
    transition: all 0.3s;
}
.btn:active { transform: scale(0.98); }
.btn .icon { font-size: 80px; animation: bounce 1.5s ease-in-out infinite; }
.btn .text { background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn .sub { font-size: 14px; color: #888; font-weight: 500; margin-top: 10px; padding: 0 20px; text-align: center; }
.btn.error { animation: none; }
.btn.error .text { background: none; -webkit-text-fill-color: #ef4444; color: #ef4444; }
.btn.success { animation: successGlow 2s ease-in-out infinite; }
.btn.success .icon { animation: none; }
@keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(168,85,247,0); } 50% { box-shadow: inset 0 0 100px 0 rgba(168,85,247,0.3); } }
@keyframes successGlow { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(34,197,94,0); } 50% { box-shadow: inset 0 0 100px 0 rgba(34,197,94,0.3); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>

<button class="btn" id="btn">
    <div class="icon" id="icon">📥</div>
    <div class="text" id="text">ĐANG TẢI...</div>
    <div class="sub" id="sub">Vui lòng đợi</div>
</button>

<script>
(function() {
    'use strict';

    var FIREBASE = 'https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/configs/';

    var btn = document.getElementById('btn');
    var iconEl = document.getElementById('icon');
    var textEl = document.getElementById('text');
    var subEl = document.getElementById('sub');

    function getParam(n) {
        return new URLSearchParams(location.search).get(n);
    }

    function setState(state, text, sub) {
        btn.className = 'btn' + (state ? ' ' + state : '');
        iconEl.textContent = state === 'error' ? '❌' : state === 'success' ? '✅' : '📥';
        textEl.textContent = text;
        if (sub !== undefined) subEl.textContent = sub;
    }

    function downloadBlob(content, filename) {
        var base64 = btoa(unescape(encodeURIComponent(content)));
        var dataUri = 'data:application/x-apple-aspen-config;base64,' + base64;

        var isSafari = /iPhone|iPad|iPod/i.test(navigator.userAgent) 
            && /Safari/i.test(navigator.userAgent) 
            && !/CriOS|FxiOS|EdgiOS/i.test(navigator.userAgent);

        if (isSafari) {
            window.location.href = dataUri;
        } else {
            var a = document.createElement('a');
            a.href = dataUri;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function() { document.body.removeChild(a); }, 100);
        }
    }

    async function loadAndDownload() {
        var configId = getParam('id');

        if (!configId) {
            setState('error', 'LỖI', 'Không có ID config trong link');
            return;
        }

        setState('', 'ĐANG TẢI...', 'Đang lấy dữ liệu từ server');

        try {
            var res = await fetch(FIREBASE + configId + '.json');

            if (!res.ok) throw new Error('HTTP ' + res.status);

            var data = await res.json();

            if (!data || !data.content) {
                setState('error', 'KHÔNG TÌM THẤY', 'Link đã được sử dụng hoặc không tồn tại');
                return;
            }

            var sizeKB = Math.round(data.content.length / 1024);
            var count = data.count || '?';
            setState('success', 'ĐANG TẢI XUỐNG', count + ' WebClip • ' + sizeKB + 'KB');

            setTimeout(function() {
                downloadBlob(data.content, data.name || 'webclip-config.mobileconfig');
                
                setTimeout(function() {
                    fetch(FIREBASE + configId + '.json', { method: 'DELETE' })
                        .then(function() {
                            setState('success', 'ĐÃ TẢI XONG', 'Config đã được xoá khỏi server');
                        })
                        .catch(function() {
                            setState('success', 'ĐÃ TẢI XONG', 'Vui lòng cài đặt file vừa tải');
                        });
                }, 1000);

            }, 300);

        } catch (err) {
            setState('error', 'LỖI', err.message);
        }
    }

    loadAndDownload();
})();
</script>

</body>
</html>
